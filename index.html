<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Автомобильный продакшн — превью</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
    @font-face {
    font-family: 'NfS MW';
    src: url('assets/Mostwasted.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    }
  /* ==========================================================
     ТОКЕНЫ (палитра/шрифты) — меняйте под свой бренд здесь
     ========================================================== */
  :root{
    --bg: #0b0c0e;              /* асфальт */
    --surface: #17181b;         /* карточки */
    --surface-line: #26282c;
    --text: #ecedf0;
    --text-muted: #83878e;
    --accent: #6fe3ff;          /* ксенон */
    --accent-warm: #ff3b30;     /* rec / стоп-сигнал */
    --font-display: 'NfS MW', 'Bebas Neue', sans-serif; /* Добавили NfS MW в главные */
    --font-label: 'NfS MW', 'Oswald', sans-serif;       /* Заменили и для меток/имён */
    --font-body: 'Inter', sans-serif;
    --font-nfs: 'NfS MW', var(--font-display);
    --ease: cubic-bezier(.76,0,.24,1);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); }
  body{
    font-family: var(--font-body);
    color: var(--text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ==========================================================
     ЭКРАНЫ — каждый на весь вьюпорт, показываем только активный
     ========================================================== */
  .screen{
    position:fixed; inset:0;
    height:100dvh; width:100vw;
    opacity:0; visibility:hidden;
    transition: opacity .6s var(--ease);
  }
  .screen.active{ opacity:1; visibility:visible; }

  /* ---- фон: сюда вставляется gif/видео ---- */
  .bg-media{
    position:absolute; inset:0;
    overflow:hidden;
    background:var(--bg);
  }
  .bg-media__asset{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
  }
  /* заглушка-текстура, пока нет своего файла — просто удалите класс bg-placeholder,
     когда вставите свой <img>/<video> */
  .bg-placeholder{
    background:
      radial-gradient(60% 50% at 30% 20%, rgba(111,227,255,.08), transparent 60%),
      radial-gradient(50% 40% at 80% 85%, rgba(255,59,48,.06), transparent 60%),
      repeating-linear-gradient(115deg, #0e0f11 0 2px, #0b0c0e 2px 4px);
    background-size: cover, cover, 6px 6px;
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift{
    from{ filter:brightness(1); background-position: 0 0, 0 0, 0 0; }
    to{ filter:brightness(1.12); background-position: 20px 10px, -15px -10px, 0 0; }
  }

  /* затемняющая плашка поверх фона, чтобы текст читался */
  .scrim{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(11,12,14,.35) 0%, rgba(11,12,14,.75) 100%);
  }

  /* ==========================================================
     ЭКРАН 1 — интро
     ========================================================== */
  .intro-content{
    position:relative; z-index:2;
    height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    gap:.75rem;
  }
  .eyebrow{
    font-family: var(--font-label);
    font-size: clamp(.7rem, 1vw, .85rem);
    letter-spacing:.35em;
    text-transform:uppercase;
    color: var(--text-muted);
  }
  .logo{
    font-family: var(--font-display);
    font-size: clamp(3.5rem, 12vw, 8rem);
    line-height:.9;
    letter-spacing:.02em;
    color: var(--text);
  }

  .enter-prompt{
    margin-top: 2rem;
    transform: translateY(10px);
    display:flex; align-items:center; gap:.6rem;
    background:transparent; border:1px solid var(--surface-line);
    padding:.7rem 1.4rem; border-radius:999px;
    color:var(--text); font-family:var(--font-label);
    font-size:.8rem; letter-spacing:.2em; text-transform:uppercase;
    cursor:pointer;
    opacity:0; pointer-events:none;
    transition: opacity .8s var(--ease), transform .8s var(--ease), border-color .3s;
  }
  .enter-prompt.visible{
    opacity:1; pointer-events:auto;
    transform: translateY(0);
  }
  .enter-prompt:hover{ border-color: var(--accent); }
  .enter-prompt:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* .rec-dot{
    width:8px; height:8px; border-radius:50%;
    background: var(--accent-warm);
    animation: blink 1.4s ease-in-out infinite;
  } */
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }

  .enter-arrow{ transition: transform .3s var(--ease); }
  .enter-prompt:hover .enter-arrow{ transform: translateX(4px); }

  /* ==========================================================
     ЭКРАН 2 — 4 блока
     ========================================================== */
  .main-content{
    position:relative; z-index:2;
    height:100%;
    display:flex; align-items:center; justify-content:center;
    padding: 6vh 6vw;
  }
  .blocks-grid{
    width:100%; max-width:300px;
    display:grid;
    grid-template-columns: 1fr;
    gap: clamp(10px, 1.6vw, 20px);
  }
.block-card{
  position:relative;
  background: transparent;
  border: none;
  padding: .95rem .9rem;
  min-height: auto;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center;
  text-decoration:none; color:var(--text);
  opacity:0; transform: translateY(16px);
  transition: opacity .6s var(--ease), transform .6s var(--ease), color .3s;
  cursor: pointer;
  font: inherit;
  width: 100%;
}
  .block-card.show{ opacity:1; transform:translateY(0); }
  .block-card:hover{ .block-card:hover{ background:rgba(255,255,255,.06); border-color: rgba(111,227,255,.55); } }
  .block-card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .block-index{
    font-family: var(--font-label);
    font-size:.68rem; letter-spacing:.2em;
    color: var(--accent);
  }
  .block-title{
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 1.3vw, 3.25rem);
    margin-top:.3rem;
    letter-spacing:.01em;
  }
  .block-desc{
    font-family: var(--font-body);
    font-size:.7rem;
    color: var(--text-muted);
    margin-top:.35rem;
    max-width: 22ch;
  }

  @media (max-width: 980px){
    .blocks-grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px){
    .blocks-grid{ grid-template-columns: 1fr; }
  }

  /* ==========================================================
    ПЕРЕХОД «ИРИС» между экранами
     ========================================================== */

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.2s !important; }
  }
</style>
</head>
<body>

  <!-- ================= ЭКРАН 1: ИНТРО ================= -->
  <section id="screen-intro" class="screen active">

    <div class="bg-media" id="bg-intro">
      <img class="bg-media__asset" src="intro.gif" alt="">
    </div>


    <div class="intro-content">

      <!-- <p class="eyebrow">Автомобильный продакшн</p> -->
      <h1 class="logo">Basement Frames</h1>

      <button id="enter-btn" class="enter-prompt" aria-label="Перейти дальше">
        <span class="rec-dot"></span>
        <span>watch it</span>
        <span class="enter-arrow">→</span>
      </button>

    </div>
  </section>

  <!-- ================= ЭКРАН 2: 4 БЛОКА ================= -->
  <section id="screen-main" class="screen">

    <div class="bg-media " id="bg-main">
      <img class="bg-media__asset" src="main.gif" alt="">
    </div>
    <!-- <div class="scrim" id="scrim-main"></div> -->

    <div class="main-content">

      <div class="blocks-grid" id="blocks-grid">

              <!-- 1 блок черный список  -->

        <a class="block-card" href="blacklist.html" data-i="1">
          <!-- <span class="block-index">01</span> -->
          <div>
            <h2 class="block-title">blacklist</h2>
            <!-- <p class="block-desc">Замените на свой текст.</p> -->
          </div>
        </a>

              <!--  2 блок мои работы -->

        <a class="block-card" href="mywork.html" data-i="2">
            <!-- <span class="block-index">02</span> -->
            <div>
              <h2 class="block-title">My works</h2>
              <!-- <p class="block-desc">Замените на свой текст.</p> -->
            </div>
        </a>

              <!-- 3 блок связь -->

        <a class="block-card" href="linkme.html" data-i="3">
          <!-- <span class="block-index">03</span> -->
          <div>
            <h2 class="block-title">Contact me</h2>
            <!-- <p class="block-desc">Замените на свой текст.</p> -->
          </div>
        </a>



        <!-- <a class="block-card" href="#" data-i="4">
          <span class="block-index">04</span>
          <div>
            <h2 class="block-title">Блок 4</h2>
            <p class="block-desc">Замените на свой текст.</p>
          </div>
        </a> -->

      </a>
      </div>
    </div>
  </section>



<script>
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 0) перезапускаем gif-фон интро с первого кадра при каждой загрузке/перезагрузке —
  //    иначе браузер может продолжить анимацию с места, где она была закэширована
  function restartGif(imgEl){
    if (!imgEl) return;
    const src = imgEl.getAttribute('src');
    if (!src) return;
    imgEl.setAttribute('src', '');
    void imgEl.offsetWidth; // форсируем перерисовку
    imgEl.setAttribute('src', src);
  }
  restartGif(document.querySelector('#bg-intro img.bg-media__asset'));

  const screenIntro = document.getElementById('screen-intro');
  const screenMain  = document.getElementById('screen-main');
  const enterBtn    = document.getElementById('enter-btn');
  const scrimMain   = document.getElementById('scrim-main');
  const cards       = document.querySelectorAll('.block-card');
<!-- если в адресе есть #screen-..., сразу открываем этот экран -->
  
if (location.hash.startsWith('#screen-')) {
    const targetScreen = document.querySelector(location.hash);
    if (targetScreen) {
      document.querySelectorAll('.screen.active').forEach(s => s.classList.remove('active'));
      targetScreen.classList.add('active');
      cards.forEach(card => card.classList.add('show'));
    }
  }

  // 1) через 3 секунды показываем кнопку "Смотреть"
  setTimeout(() => {
    enterBtn.classList.add('visible');
  }, reduceMotion ? 200 : 500);


  // 2) клик по кнопке -> переход "ирисом" на второй экран
  enterBtn.addEventListener('click', (e) => {
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;

    setTimeout(() => {
      screenIntro.classList.remove('active');
      screenMain.classList.add('active');
      startMainScreen();
    }, reduceMotion ? 10 : 100);
  });

  // 3) на втором экране блоки появляются с небольшой задержкой
  function startMainScreen(){
    cards.forEach((card, i) => {
      setTimeout(() => card.classList.add('show'), (reduceMotion ? 0 : 400) + i * 150);
    });
  }
</script>


</body>
</html>
